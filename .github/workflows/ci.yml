name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/dnsguard
          python -m pip install -e packages/toney

      - name: Test dnsguard
        working-directory: packages/dnsguard
        run: python -m unittest discover -s tests -v

      - name: Test toney
        working-directory: packages/toney
        run: python -m unittest discover -s tests -v

      - name: Check the applications still start
        run: |
          dnsguard version
          python -c "import toney; print('toney', toney.__version__)"

  stdlib-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No third-party imports
        run: |
          python scripts/check_stdlib_only.py

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No personal data in the tree
        run: |
          python scripts/check_no_pii.py
