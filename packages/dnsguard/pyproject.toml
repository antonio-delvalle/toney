[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnsguard"
version = "0.1.0"
description = "A DNS filtering service with a query log, expiry and a control socket"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The Toney authors" }]
keywords = ["dns", "filtering", "privacy", "telemetry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: System :: Networking :: Firewalls",
]
dependencies = []

[project.scripts]
dnsguard = "dnsguard.cli:main"

[project.urls]
Homepage = "https://github.com/antonio-delvalle/toney"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
